worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    keepalive_requests 20;
    client_max_body_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 2k;
    limit_req_zone $binary_remote_addr zone=per_ip:1m rate=2r/s;
    limit_req_zone $server_name zone=total:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;
        include /etc/nginx/allowed-clients.conf;
        deny all;
        limit_req zone=per_ip burst=8 nodelay;
        limit_req zone=total burst=16 nodelay;
        limit_req_status 429;
        limit_conn connections 4;
        limit_conn_status 429;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        location / {
            limit_except GET { deny all; }
            proxy_pass http://dashboard:8090;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_http_version 1.0;
            proxy_set_header Connection close;
            proxy_set_header Host dashboard;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
    }
}
