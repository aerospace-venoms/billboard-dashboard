name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core openssl
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public.py
      - run: python scripts/demo.py && git diff --exit-code -- docs/demo.png
      - run: docker build -t billboard-dashboard .
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          python3 scripts/setup.py --non-interactive --server-ip 127.0.0.1
          --allow 127.0.0.1/32 --home-lat 40 --home-lon -100 --timezone UTC
      - run: >-
          docker run --rm -v "$PWD:/project" -w /project
          espressif/idf:v5.4 idf.py -C firmware build
      # Never upload the build: firmware contains the disposable device token.
